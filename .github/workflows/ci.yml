# Checks every push and pull request: the code is formatted, compiles without warnings,
# and every test passes, on every platform. Three jobs side by side: the JVM with everything
# that runs there, and the core's tests on JavaScript and on Scala Native, the slowest to build.
name: CI

on:
  push:
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mill
          key: mill-${{ hashFiles('mill', 'build.mill') }}
      # scala-cli only for the guided tour's worksheets; Mill brings its own Java.
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          scala-cli-version: 1.18.0
          jvm: temurin:17
      - name: Formatting
        run: |
          ./mill mill.scalalib.scalafmt/checkFormatAll
          scala-cli fmt --check docs/tour
      - name: Tests on the JVM, and the page's on Node
        run: ./mill '{core.jvm,cli.jvm,web,speed}.test'
      # Only reports for now, as a notice on the run's page: the baseline must come from these
      # machines, so --check waits until a few runs show how much the ratio moves.
      - name: The speed guard
        run: ./mill speed.run
      - name: The microbenchmarks compile (running them takes a quiet machine)
        run: ./mill bench.compile
      - name: The API docs build
        run: ./mill api.docJar
      - name: The guided tour's worksheets, on the library as published
        run: |
          ./mill __.publishLocal
          for sheet in docs/tour/*.sc; do scala-cli run "$sheet" --server=false || exit 1; done
      - name: Name the failed tests
        if: failure()
        run: python3 .github/failed-tests.py

  platform:
    strategy:
      matrix:
        platform: [js, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mill
          key: mill-${{ hashFiles('mill', 'build.mill') }}
      - name: The core's tests on ${{ matrix.platform }}
        run: ./mill core.${{ matrix.platform }}.test
      # The release's executable links too: it builds the command line, not only the core.
      - name: The native executable
        if: matrix.platform == 'native'
        run: ./mill cli.native.nativeLink && out/cli/native/nativeLink.dest/out check 44 117 240
      - name: Name the failed tests
        if: failure()
        run: python3 .github/failed-tests.py
