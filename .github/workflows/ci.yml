# Checks every push and pull request: the code is formatted, compiles without warnings,
# and every test passes.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: VirtusLab/scala-cli-setup@v1
        with:
          scala-cli-version: 1.18.0
          jvm: temurin:17
      - name: Formatting
        run: scala-cli fmt --check .
      # Without the build server: with it, scala-cli 1.18 prints warnings that -Werror turns
      # into errors, but still exits with success.
      - name: Tests
        run: scala-cli test . --server=false
      - name: The web page's tests, compiled to JavaScript and run on Node
        run: scala-cli test web --server=false
      - name: The core's tests on JavaScript
        run: scala-cli test cross --js --server=false
      - name: The core's tests on Scala Native
        run: scala-cli test cross --native --server=false
      - name: The guided tour's worksheets
        run: for sheet in docs/tour/*.sc; do scala-cli run "$sheet" --server=false || exit 1; done
      - name: The microbenchmarks compile (running them takes a quiet machine)
        run: scala-cli --power compile bench --server=false
      - name: The API docs build
        run: scala-cli doc . -o api --server=false -O -project:perfectcuboid
