# Mutation testing with Stryker4s (https://stryker-mutator.io): it changes the code one small
# way at a time, a + for a −, a < for a <=, a condition for true, and checks that some test
# fails each time. A change no test notices is a gap in the tests, or code that does nothing.
#
# Run it with
#
#   mutation/run.sh
#
# It copies the files below to target/, builds them with every mutant in, and runs
# mutation/tests.sh once for each, with ACTIVE_MUTATION saying which one is on. The report is
# in target/stryker4s-report. It takes hours: each mutant is a run of the tests.
stryker4s {
  mutate: [
    "core/src/Arith.scala", "core/src/Wide.scala", "core/src/Montgomery.scala",
    "core/src/NumberTheory.scala", "core/src/PollardRho.scala", "core/src/Pythagorean.scala",
    "core/src/Sieve.scala", "core/src/FastSearch.scala", "core/src/Search.scala"
  ]
  files: ["mill", "build.mill", ".scalafmt.conf", "core/**", "cli/**", "mutation/**"]
  test-runner: {
    command: "./mutation/tests.sh"
    args: ""
  }
  scala-dialect: "scala3"
  reporters: ["console", "html", "json"]
  concurrency: 1
}
