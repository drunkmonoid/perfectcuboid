<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img">
<title>Families of primitive bricks, joined by derivation and curves</title>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e6e5e0;
        --series-1: #2a78d6; --series-2: #eb6834; font-family: system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --grid: #383835;
          --series-1: #3987e5; --series-2: #d95926; }
  }
  .surface { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .label { fill: var(--ink-2); font-size: 12px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .s1 { stroke: var(--series-1); fill: var(--series-1); }
  .s2 { stroke: var(--series-2); fill: var(--series-2); }
  .line { fill: none; stroke-width: 2; }
  .dot { stroke: var(--surface); stroke-width: 1; }
  .dense { stroke: none; fill-opacity: 0.4; }
</style>
<rect class="surface" width="720" height="440" rx="8"/>
<text class="title" x="72" y="30">Families of primitive bricks, joined by derivation and curves</text>
<text class="label" x="321" y="424" text-anchor="middle">bricks in the piece</text>
<text class="label" transform="translate(18 227) rotate(-90)" text-anchor="middle">pieces of that size</text>
<line class="grid" x1="72.0" y1="70" x2="72.0" y2="384"/><text class="label" x="72.0" y="402" text-anchor="middle">1</text>
<line class="grid" x1="570.0" y1="70" x2="570.0" y2="384"/><text class="label" x="570.0" y="402" text-anchor="middle">10</text>
<line class="grid" x1="72" y1="384.0" x2="570" y2="384.0"/><text class="label" x="64" y="388.0" text-anchor="end">1</text>
<line class="grid" x1="72" y1="305.5" x2="570" y2="305.5"/><text class="label" x="64" y="309.5" text-anchor="end">10</text>
<line class="grid" x1="72" y1="227.0" x2="570" y2="227.0"/><text class="label" x="64" y="231.0" text-anchor="end">10<tspan dy="-6" font-size="9">2</tspan></text>
<line class="grid" x1="72" y1="148.5" x2="570" y2="148.5"/><text class="label" x="64" y="152.5" text-anchor="end">10<tspan dy="-6" font-size="9">3</tspan></text>
<line class="grid" x1="72" y1="70.0" x2="570" y2="70.0"/><text class="label" x="64" y="74.0" text-anchor="end">10<tspan dy="-6" font-size="9">4</tspan></text>
<circle class="s1 dot" cx="72.0" cy="76.4" r="3.5"><title>8285 pieces of 1 brick</title></circle>
<circle class="s1 dot" cx="221.9" cy="107.0" r="3.5"><title>3374 pieces of 2 bricks</title></circle>
<circle class="s1 dot" cx="309.6" cy="305.5" r="3.5"><title>10 pieces of 3 bricks</title></circle>
<circle class="s1 dot" cx="371.8" cy="360.4" r="3.5"><title>2 pieces of 4 bricks</title></circle>
<circle class="s1 dot" cx="492.9" cy="360.4" r="3.5"><title>2 pieces of 7 bricks</title></circle>
<circle class="s1 dot" cx="521.7" cy="360.4" r="3.5"><title>2 pieces of 8 bricks</title></circle>
</svg>
